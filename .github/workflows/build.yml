name: Build

on:
  push:
    branches: [main]
    # تعديل الوثائق بس مش محتاج بناء APK
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/brand/logo_options/**"
      - "assets/brand/screens/**"
      - "assets/brand/store/**"
      - "test_screens/out/**"
  pull_request:
  workflow_dispatch:

# لو اترفع commit جديد، نلغي البناء القديم اللي لسه شغال
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # مفتاح التوقيع (اختياري): لازم يكون ثابت عشان تسجيل الدخول بجوجل يشتغل
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      # إعدادات Firebase بتيجي من GitHub Secrets؛ لو مش موجودة التطبيق بيشتغل في وضع الضيف
      - name: Build APK
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          DEFINES=(
            --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY"
            --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID"
            --dart-define=FIREBASE_SENDER_ID="$FIREBASE_SENDER_ID"
            --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
            --dart-define=FIREBASE_STORAGE_BUCKET="$FIREBASE_STORAGE_BUCKET"
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
          )
          # APK عام (بيشتغل على أي تليفون) + APK أصغر لكل نوع معالج
          flutter build apk --release "${DEFINES[@]}"
          flutter build apk --release --split-per-abi "${DEFINES[@]}"
          ls -lh build/app/outputs/flutter-apk/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hayati-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # الأصغر: arm64 لمعظم التليفونات الحديثة
      - uses: actions/upload-artifact@v4
        with:
          name: hayati-apk-per-abi
          path: build/app/outputs/flutter-apk/app-*-release.apk

  functions:
    name: Cloud Functions (type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  connector:
    name: Claude Connector (type-check + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
